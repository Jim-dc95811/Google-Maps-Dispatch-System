<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">Offline GeoStack</title>
  <desc id="desc">A Windows-first offline geospatial stack connecting QGIS, MBTiles, a custom TPKX converter, ArcGIS Earth, and live field positioning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#11223c"/>
      <stop offset="1" stop-color="#0a3144"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6dd5a0"/>
      <stop offset="0.48" stop-color="#70a7ff"/>
      <stop offset="1" stop-color="#a989ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="24"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#92a8c6"/></marker>
  </defs>

  <rect width="1400" height="460" rx="30" fill="url(#bg)"/>
  <circle cx="120" cy="85" r="95" fill="#39d98a" opacity="0.10" filter="url(#soft)"/>
  <circle cx="1250" cy="100" r="125" fill="#6f8cff" opacity="0.12" filter="url(#soft)"/>
  <circle cx="1040" cy="390" r="100" fill="#a777ff" opacity="0.10" filter="url(#soft)"/>

  <text x="70" y="92" font-family="Segoe UI,Arial,sans-serif" font-size="56" font-weight="800" fill="#ffffff">Offline GeoStack</text>
  <rect x="70" y="111" width="560" height="5" rx="2.5" fill="url(#glow)"/>
  <text x="70" y="154" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#b8c8dd">QGIS → TPKX → ArcGIS Earth + Live Field Positioning</text>
  <text x="70" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#7f95b0">Build the geographic environment online. Carry it locally. Keep operating when the network disappears.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="248" width="205" height="112" rx="18" fill="#14283b" stroke="#4dc88a" stroke-width="2"/>
    <circle cx="111" cy="285" r="22" fill="#3fa56f"/>
    <text x="111" y="293" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#fff">Q</text>
    <text x="173" y="283" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#fff">QGIS</text>
    <text x="175" y="315" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a9bdd2">render engine</text>
    <text x="175" y="340" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#6dd5a0">layers • labels • pixels</text>
  </g>

  <line x1="277" y1="304" x2="338" y2="304" stroke="#92a8c6" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="351" y="248" width="205" height="112" rx="18" fill="#14283b" stroke="#d7a84f" stroke-width="2"/>
    <rect x="379" y="270" width="44" height="44" rx="7" fill="#c89333"/>
    <path d="M389 281h24M389 292h24M389 303h24" stroke="#fff" stroke-width="3"/>
    <text x="485" y="283" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">MBTiles</text>
    <text x="454" y="315" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a9bdd2">temporary pyramid</text>
    <text x="454" y="340" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#f1c972">SQLite • raster tiles</text>
  </g>

  <line x1="556" y1="304" x2="617" y2="304" stroke="#92a8c6" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="630" y="235" width="260" height="138" rx="18" fill="#14283b" stroke="#9c7cff" stroke-width="2"/>
    <circle cx="671" cy="277" r="23" fill="#7a5ed0"/>
    <text x="671" y="285" text-anchor="middle" font-family="Consolas,monospace" font-size="19" font-weight="800" fill="#fff">Py</text>
    <text x="772" y="276" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">TPKX Converter</text>
    <text x="760" y="310" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a9bdd2">TMS flip • 128×128 bundles</text>
    <text x="760" y="334" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#c3b0ff">Compact Cache V2 • metadata</text>
    <text x="760" y="357" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#a989ff">existing raster bytes preserved</text>
  </g>

  <line x1="890" y1="304" x2="951" y2="304" stroke="#92a8c6" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="964" y="248" width="190" height="112" rx="18" fill="#14283b" stroke="#5ca7ef" stroke-width="2"/>
    <rect x="994" y="270" width="48" height="44" rx="6" fill="#2e76b5"/>
    <path d="M1003 282h30M1003 293h30M1003 304h30" stroke="#fff" stroke-width="2.5"/>
    <text x="1094" y="284" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#fff">TPKX</text>
    <text x="1060" y="316" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a9bdd2">native package</text>
    <text x="1060" y="340" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#70b8ff">multi-zoom • offline</text>
  </g>

  <line x1="1154" y1="304" x2="1204" y2="304" stroke="#92a8c6" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1216" y="235" width="130" height="138" rx="18" fill="#14283b" stroke="#43b7df" stroke-width="2"/>
    <circle cx="1281" cy="276" r="27" fill="#2084b4"/>
    <path d="M1258 276c15-19 31-19 46 0-15 19-31 19-46 0zm7 0c10 10 22 10 32 0-10-10-22-10-32 0z" fill="#fff"/>
    <text x="1281" y="322" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">ArcGIS Earth</text>
    <text x="1281" y="345" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" fill="#9fd9ef">GNSS • PRAVE</text>
    <text x="1281" y="361" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" fill="#9fd9ef">F22 • QR • KML</text>
  </g>

  <rect x="70" y="402" width="1260" height="34" rx="17" fill="#07101c" opacity="0.85"/>
  <text x="700" y="424" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#d8e5f5">NO OPERATIONAL INTERNET DEPENDENCY • RELEASE-ACCEPTED TPKX FACTORY v1.0.0 • LIVE-PROVEN ARCGIS EARTH RUNTIME</text>
</svg>
