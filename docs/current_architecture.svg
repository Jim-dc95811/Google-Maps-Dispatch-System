<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">Offline GeoStack current architecture</title>
  <desc id="desc">QGIS manufactures raster MBTiles. One branch converts MBTiles to native TPKX for ArcGIS Earth desktop or mobile local-file use. A second branch serves MBTiles over local HTTPS WMTS through USB tether to ArcGIS Earth Mobile. Live GNSS and field telemetry surround the ArcGIS Earth runtime. No outside Internet is required operationally.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4b5563"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="1400" height="470" rx="22" fill="#f7f9fc"/>
  <text x="700" y="42" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="31" font-weight="700" fill="#162235">Offline GeoStack — 2026-08-16 Current Architecture</text>
  <text x="700" y="70" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#526273">QGIS → verified MBTiles → local TPKX or local HTTPS WMTS → ArcGIS Earth desktop/mobile</text>

  <g filter="url(#shadow)"><rect x="55" y="164" width="190" height="112" rx="16" fill="#ffffff" stroke="#3a8d5d" stroke-width="3"/><circle cx="93" cy="201" r="20" fill="#3a8d5d"/><text x="93" y="208" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Q</text><text x="150" y="199" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#1d2939">QGIS</text><text x="150" y="229" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#526273">3.44.9 render engine</text><text x="150" y="251" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#526273">layers • labels • pixels</text></g>
  <line x1="245" y1="220" x2="302" y2="220" stroke="#4b5563" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="315" y="164" width="205" height="112" rx="16" fill="#ffffff" stroke="#d09a2d" stroke-width="3"/><rect x="342" y="185" width="42" height="42" rx="6" fill="#d09a2d"/><path d="M351 196h24M351 206h24M351 216h24" stroke="#fff" stroke-width="3"/><text x="438" y="199" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#1d2939">MBTiles</text><text x="417" y="229" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#526273">verified raster pyramid</text><text x="417" y="251" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#526273">SQLite • PNG/JPEG tiles</text></g>

  <!-- upper TPKX branch -->
  <path d="M520 205 C585 205 585 128 650 128" fill="none" stroke="#4b5563" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="664" y="84" width="225" height="116" rx="16" fill="#ffffff" stroke="#6b5bd2" stroke-width="3"/><circle cx="702" cy="123" r="20" fill="#6b5bd2"/><text x="702" y="130" text-anchor="middle" font-family="Consolas,monospace" font-size="18" font-weight="700" fill="#fff">Py</text><text x="792" y="119" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d2939">MBTiles → TPKX</text><text x="777" y="149" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" fill="#526273">Compact Cache V2 • bundles</text><text x="777" y="171" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#6b5bd2">tile bytes preserved</text></g>
  <line x1="889" y1="142" x2="946" y2="142" stroke="#4b5563" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="960" y="88" width="130" height="108" rx="16" fill="#ffffff" stroke="#2e7dbf" stroke-width="3"/><path d="M988 110h73v50h-73z" fill="#e8f3fb" stroke="#2e7dbf" stroke-width="2"/><path d="M997 121h55M997 132h55M997 143h55" stroke="#2e7dbf" stroke-width="2"/><text x="1025" y="181" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#1d2939">TPKX</text></g>
  <line x1="1090" y1="142" x2="1145" y2="142" stroke="#4b5563" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="1158" y="82" width="185" height="122" rx="16" fill="#ffffff" stroke="#1678c8" stroke-width="3"/><circle cx="1200" cy="121" r="23" fill="#1678c8"/><path d="M1180 121c13-17 28-17 40 0-12 17-27 17-40 0zm6 0c9 9 20 9 28 0-8-9-19-9-28 0z" fill="#fff" opacity="0.92"/><text x="1265" y="116" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1d2939">ArcGIS Earth</text><text x="1250" y="143" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#526273">Windows / Mobile</text><text x="1250" y="164" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#526273">local TPKX</text><text x="1250" y="184" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" fill="#6b5bd2">desktop: GNSS • PRAVE • F22 • QR</text></g>

  <!-- lower Map Fountain branch -->
  <path d="M520 235 C585 235 585 320 650 320" fill="none" stroke="#4b5563" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="664" y="268" width="225" height="118" rx="16" fill="#ffffff" stroke="#0f8b8d" stroke-width="3"/><circle cx="702" cy="307" r="20" fill="#0f8b8d"/><path d="M691 307h22M702 296v22" stroke="#fff" stroke-width="3"/><text x="793" y="303" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#1d2939">USB Map Fountain</text><text x="777" y="332" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13.5" fill="#526273">local HTTPS WMTS</text><text x="777" y="354" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#526273">unique map IDs • QR loading</text><text x="777" y="374" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0f8b8d">outside Internet not required</text></g>
  <line x1="889" y1="327" x2="946" y2="327" stroke="#4b5563" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="960" y="278" width="160" height="98" rx="16" fill="#ffffff" stroke="#5965a8" stroke-width="3"/><path d="M989 304h46v28h-46z" fill="#eef0fb" stroke="#5965a8" stroke-width="2"/><path d="M1044 301l23 16-23 16z" fill="#5965a8"/><text x="1040" y="357" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1d2939">USB tether</text><text x="1040" y="373" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" fill="#526273">Remote NDIS</text></g>
  <line x1="1120" y1="327" x2="1160" y2="327" stroke="#4b5563" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="1172" y="266" width="170" height="122" rx="16" fill="#ffffff" stroke="#1678c8" stroke-width="3"/><rect x="1194" y="287" width="42" height="70" rx="8" fill="#e8f3fb" stroke="#1678c8" stroke-width="2"/><circle cx="1215" cy="348" r="3" fill="#1678c8"/><text x="1282" y="302" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1d2939">ArcGIS Earth</text><text x="1282" y="325" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1d2939">Mobile</text><text x="1270" y="349" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#526273">on-demand tiles</text><text x="1270" y="369" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#0f8b8d">LIVE-PROVEN</text></g>

  <rect x="345" y="417" width="710" height="34" rx="17" fill="#162235"/>
  <text x="700" y="439" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#ffffff">LOCAL FILE OR LOCAL SERVICE • NO OPERATIONAL DEPENDENCE ON THE PUBLIC INTERNET</text>
</svg>
